name: Keep Backend Alive

on:
  schedule:
    # Runs every 8 minutes to account for GitHub Actions scheduling delays
    - cron: '*/8 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s -o /dev/null -w "%{http_code}" https://reactorx.onrender.com/api/health
        # NOTE: Replace the URL with your actual backend URL if it's different.
